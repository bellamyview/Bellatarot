<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>貝拉神秘魔法屋｜塔羅牌指南</title>
<meta name="description" content="貝拉神秘魔法屋 — 78張塔羅牌完整圖鑑與牌義解讀">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cinzel+Decorative:wght@700&family=Noto+Serif+TC:wght@400;500;600;700;900&family=Noto+Sans+TC:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void:#0a0512;
    --bg-deep:#160a26;
    --bg-panel:#1c0f30;
    --bg-panel-2:#22123a;
    --purple-1:#3d1a78;
    --purple-2:#5b2c8f;
    --purple-glow: rgba(147, 90, 220, .45);
    --gold:#cda84e;
    --gold-bright:#e8c877;
    --gold-dim:#8a7136;
    --ink:#efe7f7;
    --ink-dim:#b6a6cf;
    --ink-faint:#7c6a97;
    --line: rgba(205,168,78,.25);

    --wands:#d98a4e;
    --cups:#7fa8d9;
    --swords:#b7bfd6;
    --pentacles:#8fc79a;
    --major:#e8c877;

    --serif: 'Noto Serif TC', serif;
    --sans: 'Noto Sans TC', sans-serif;
    --display: 'Cinzel', serif;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family: var(--sans);
    background: radial-gradient(ellipse at 50% -10%, #2a1448 0%, var(--bg-deep) 45%, var(--bg-void) 100%);
    color: var(--ink);
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }

  /* ---------- starfield ---------- */
  #stars{
    position:fixed; inset:0; z-index:0; pointer-events:none;
  }
  .star{
    position:absolute; border-radius:50%;
    background: var(--gold-bright);
    opacity:.5;
    animation: twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:.15; transform:scale(1);}
    50%{ opacity:.9; transform:scale(1.4);}
  }
  @media (prefers-reduced-motion: reduce){
    .star{ animation: none; opacity:.4;}
  }

  .wrap{ position:relative; z-index:1; max-width:1180px; margin:0 auto; padding: 0 24px; }

  /* ---------- header ---------- */
  header{ padding: 54px 24px 20px; text-align:center; position:relative; z-index:1;}
  .brand-mark{
    display:inline-flex; align-items:center; justify-content:center;
    width:64px; height:64px; margin-bottom:18px;
    border:1px solid var(--line); border-radius:50%;
    position:relative;
  }
  .brand-mark::before{
    content:""; position:absolute; inset:8px; border:1px solid var(--gold-dim); border-radius:50%;
  }
  .brand-mark svg{ width:28px; height:28px; }

  h1.title{
    font-family: var(--serif);
    font-weight:700;
    font-size: clamp(2rem, 5vw, 3.1rem);
    letter-spacing: .08em;
    background: linear-gradient(180deg, var(--gold-bright), var(--gold) 60%, var(--gold-dim));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    line-height:1.3;
  }
  .subtitle{
    margin-top:10px;
    font-family: var(--display);
    font-size: .78rem;
    letter-spacing:.42em;
    color: var(--ink-faint);
    text-transform:uppercase;
  }
  .tagline{
    margin-top:22px; font-size:.98rem; color: var(--ink-dim);
    font-weight:300; letter-spacing:.02em;
  }

  /* ---------- breadcrumb / back nav ---------- */
  .crumbbar{
    display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:6px 10px;
    padding: 8px 24px 30px; font-size:.88rem; color: var(--ink-faint);
    min-height: 26px;
  }
  .crumbbar button{
    background:none; border:none; color: var(--gold); font-family:var(--sans);
    font-size:.88rem; cursor:pointer; letter-spacing:.03em; padding:2px 4px;
    border-bottom:1px solid transparent; transition: border-color .2s, color .2s;
    white-space:nowrap;
  }
  .crumbbar button:hover{ border-color: var(--gold); color: var(--gold-bright); }
  .crumb-sep{ color: var(--ink-faint); opacity:.5; }
  .crumb-current{ color: var(--ink-dim); }

  main{ position:relative; z-index:1; padding-bottom: 90px; min-height: 40vh; }

  /* ---------- section titles ---------- */
  .section-head{ text-align:center; margin: 6px 0 34px; }
  .section-head h2{
    font-family: var(--serif); font-weight:600; font-size: clamp(1.5rem, 3vw, 2rem);
    color: var(--ink);
  }
  .section-head p{
    margin-top:10px; color: var(--ink-dim); font-size:.92rem; max-width:560px;
    margin-left:auto; margin-right:auto; line-height:1.9; font-weight:300;
  }
  .section-head .element-tag{
    display:inline-block; margin-top:14px; font-family: var(--display);
    font-size:.72rem; letter-spacing:.32em; color: var(--gold-dim);
  }

  /* ---------- category grid (home) ---------- */
  .cat-grid{
    display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 22px; margin-top: 10px;
  }
  .cat-card{
    position:relative; cursor:pointer;
    background: linear-gradient(160deg, var(--bg-panel-2), var(--bg-panel) 70%);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 34px 22px 28px;
    text-align:center;
    transition: transform .35s cubic-bezier(.2,.8,.25,1), box-shadow .35s ease, border-color .35s ease;
    overflow:hidden;
  }
  .cat-card::before{
    content:""; position:absolute; inset:0;
    background: radial-gradient(circle at 50% 0%, var(--accent, var(--gold)) 0%, transparent 65%);
    opacity:0; transition: opacity .35s ease;
  }
  .cat-card:hover{
    transform: translateY(-10px);
    border-color: var(--accent, var(--gold));
    box-shadow: 0 22px 44px -18px var(--purple-glow), 0 0 0 1px var(--accent, var(--gold)) inset;
  }
  .cat-card:hover::before{ opacity:.12; }
  .cat-card .glyph{
    width:46px; height:46px; margin:0 auto 18px;
    display:flex; align-items:center; justify-content:center;
    color: var(--accent, var(--gold));
  }
  .cat-card .glyph svg{ width:100%; height:100%; }
  .cat-card h3{
    font-family: var(--serif); font-size:1.2rem; font-weight:600; letter-spacing:.05em;
    color: var(--ink);
  }
  .cat-card .en{
    font-family: var(--display); font-size:.65rem; letter-spacing:.28em; text-transform:uppercase;
    color: var(--accent, var(--gold)); margin-top:8px; display:block;
  }
  .cat-card .count{
    margin-top: 14px; font-size:.78rem; color: var(--ink-faint); font-weight:300;
  }

  /* ---------- card grid ---------- */
  .toolbar{
    display:flex; justify-content:center; margin-bottom: 30px;
  }
  .search-box{
    position:relative; width:100%; max-width:320px;
  }
  .search-box input{
    width:100%; background: var(--bg-panel); border:1px solid var(--line);
    color: var(--ink); font-family: var(--sans); font-size:.9rem;
    padding: 11px 16px; border-radius:2px; outline:none;
    transition: border-color .25s;
  }
  .search-box input:focus{ border-color: var(--gold); }
  .search-box input::placeholder{ color: var(--ink-faint); }

  .toolbar{ flex-direction:column; align-items:center; gap:10px; }
  .search-note{
    font-size:.82rem; color: var(--ink-faint); letter-spacing:.03em; text-align:center;
  }
  .search-note b{ color: var(--gold); font-weight:600; }

  .card-grid{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 26px 20px;
  }
  .tcard .suit-hint{
    margin-top:4px; font-family: var(--display); font-size:.6rem; letter-spacing:.2em;
    text-transform:uppercase; color: var(--accent-c, var(--gold-dim)); opacity:.75;
  }
  .tcard{
    cursor:pointer; text-align:center;
    transition: transform .3s cubic-bezier(.2,.8,.25,1);
  }
  .tcard .frame{
    position:relative; border-radius: 8px; overflow:hidden;
    border: 1px solid var(--line);
    background: var(--bg-panel);
    aspect-ratio: 2 / 3.35;
    transition: box-shadow .3s ease, border-color .3s ease, transform .3s cubic-bezier(.2,.8,.25,1);
  }
  .tcard .frame img{
    width:100%; height:100%; object-fit:cover; display:block;
    filter: saturate(.92);
  }
  .tcard .frame::after{
    content:""; position:absolute; inset:0;
    box-shadow: inset 0 0 0 1px rgba(205,168,78,.35);
    border-radius: 8px; pointer-events:none;
  }
  .tcard:hover{ transform: translateY(-12px); }
  .tcard:hover .frame{
    border-color: var(--accent-c, var(--gold));
    box-shadow: 0 26px 40px -16px rgba(0,0,0,.65), 0 0 26px -4px var(--accent-c, var(--purple-glow));
  }
  .tcard .label{
    margin-top: 12px; font-family: var(--serif); font-size:.92rem; color: var(--ink-dim);
    font-weight:500; transition: color .3s;
  }
  .tcard:hover .label{ color: var(--gold-bright); }

  .empty-state{
    text-align:center; color: var(--ink-faint); padding: 60px 20px; font-size:.95rem;
  }

  /* ---------- modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; z-index:50;
    background: rgba(6,3,12,.82);
    backdrop-filter: blur(3px);
    display:flex; align-items:center; justify-content:center;
    padding: 40px 18px;
    overflow-y:auto;
    opacity:0; pointer-events:none;
    transition: opacity .28s ease;
  }
  .modal-overlay.open{ opacity:1; pointer-events:auto; }

  .modal{
    width:100%; max-width: 780px;
    margin: auto;
    background: linear-gradient(160deg, var(--bg-panel-2), var(--bg-deep));
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow: 0 40px 90px -30px rgba(0,0,0,.8), 0 0 60px -20px var(--purple-glow);
    position:relative;
    transform: translateY(18px) scale(.98);
    opacity:0;
    transition: transform .32s cubic-bezier(.2,.8,.25,1), opacity .32s ease;
  }
  .modal-overlay.open .modal{ transform: translateY(0) scale(1); opacity:1; }

  .modal-close{
    position:absolute; top:18px; right:18px; z-index:2;
    width:34px; height:34px; border-radius:50%;
    border:1px solid var(--line); background: rgba(10,5,18,.5);
    color: var(--ink-dim); cursor:pointer; font-size:1.1rem; line-height:1;
    display:flex; align-items:center; justify-content:center;
    transition: border-color .2s, color .2s, transform .2s;
  }
  .modal-close:hover{ border-color: var(--gold); color: var(--gold-bright); transform: rotate(90deg); }

  .modal-body{
    display:grid; grid-template-columns: 230px 1fr;
    gap: 0;
  }
  .modal-media{
    padding: 34px 28px; display:flex; flex-direction:column; align-items:center;
    border-right: 1px solid var(--line);
  }
  .modal-media img{
    width:100%; max-width:220px; border-radius:8px;
    border: 1px solid var(--line);
    box-shadow: 0 20px 40px -14px rgba(0,0,0,.6);
  }
  .modal-media .num{
    margin-top:16px; font-family: var(--display); font-size:.7rem; letter-spacing:.3em;
    color: var(--gold-dim);
  }

  .modal-info{ padding: 34px 34px 34px 30px; min-width:0; }
  .modal-info .suit-tag{
    font-family: var(--display); font-size:.66rem; letter-spacing:.28em; text-transform:uppercase;
    color: var(--accent-c, var(--gold));
  }
  .modal-info h3{
    font-family: var(--serif); font-size:1.65rem; font-weight:700; margin-top:8px; color: var(--ink);
  }
  .modal-info .name-en{
    font-family: var(--display); font-size:.82rem; letter-spacing:.14em; color: var(--ink-faint);
    margin-top:4px;
  }
  .modal-info .desc{
    margin-top:16px; font-size:.9rem; line-height:1.95; color: var(--ink-dim); font-weight:300;
  }

  .polarity-tabs{
    display:flex; gap:4px; margin-top:24px; border-bottom: 1px solid var(--line);
  }
  .polarity-tabs button{
    flex:1; background:none; border:none; padding: 10px 6px;
    font-family: var(--serif); font-size:.92rem; color: var(--ink-faint); cursor:pointer;
    position:relative; transition: color .25s;
  }
  .polarity-tabs button.active{ color: var(--gold-bright); }
  .polarity-tabs button::after{
    content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px;
    background: var(--gold); transform: scaleX(0); transition: transform .25s ease;
  }
  .polarity-tabs button.active::after{ transform: scaleX(1); }

  .keywords{
    display:flex; flex-wrap:wrap; gap:8px; margin-top:18px;
  }
  .keywords span{
    font-size:.78rem; padding: 5px 13px; border-radius: 20px;
    border: 1px solid var(--line); color: var(--ink-dim); font-weight:300;
  }

  .aspects{
    display:grid; grid-template-columns: 1fr 1fr; gap: 16px 22px; margin-top: 22px;
  }
  .aspect-item h4{
    font-family:var(--serif); font-size:.86rem; color: var(--gold); font-weight:600;
    display:flex; align-items:center; gap:7px;
  }
  .aspect-item h4 .dot{ width:5px; height:5px; border-radius:50%; background: var(--accent-c, var(--gold)); }
  .aspect-item p{
    margin-top:6px; font-size:.83rem; line-height:1.85; color: var(--ink-dim); font-weight:300;
  }

  .decision-block{
    margin-top: 22px; padding-top:18px; border-top: 1px dashed var(--line);
  }
  .decision-block h4{
    font-family:var(--serif); font-size:.86rem; color: var(--gold); font-weight:600;
    display:flex; align-items:center; gap:7px;
  }
  .decision-block h4 .dot{ width:5px; height:5px; border-radius:50%; background: var(--accent-c, var(--gold)); }
  .decision-block p{
    margin-top:6px; font-size:.83rem; line-height:1.85; color: var(--ink-dim); font-weight:300;
  }

  @media (max-width: 620px){
    .modal-body{ grid-template-columns: 1fr; }
    .modal-media{ border-right:none; border-bottom:1px solid var(--line); padding: 30px 24px 22px; flex-direction:row; gap:16px; align-items:center; }
    .modal-media img{ max-width:110px; }
    .modal-info{ padding: 26px 24px 30px; }
    .aspects{ grid-template-columns: 1fr; }
  }

  /* ---------- footer ---------- */
  footer{
    position:relative; z-index:1;
    border-top: 1px solid var(--line);
    padding: 40px 24px 46px;
    text-align:center;
  }
  footer .ask-bella{
    max-width: 560px; margin: 0 auto;
    font-family: var(--serif); font-size:.95rem; color: var(--ink-dim); line-height:2;
  }
  footer .ask-bella strong{ color: var(--gold-bright); font-weight:600; }
  footer .fineprint{
    margin-top:18px; font-size:.74rem; color: var(--ink-faint); letter-spacing:.04em;
  }

  ::selection{ background: var(--purple-2); color:#fff; }

  a:focus-visible, button:focus-visible, [tabindex]:focus-visible{
    outline: 1px solid var(--gold-bright); outline-offset: 3px;
  }

  .hidden{ display:none !important; }

  /* ---------- online presence bar ---------- */
  .online-bar{
    position:relative; z-index:2;
    display:flex; align-items:center; justify-content:center; gap:9px;
    padding: 9px 16px;
    background: rgba(10,5,18,.6);
    border-bottom: 1px solid var(--line);
    font-family: var(--sans); font-size:.78rem; color: var(--ink-dim);
    letter-spacing:.03em;
  }
  .pulse-dot{
    width:7px; height:7px; border-radius:50%; background:#8ee0a8; flex-shrink:0;
    box-shadow: 0 0 0 0 rgba(142,224,168,.6);
    animation: pulseDot 2.2s ease-out infinite;
  }
  @keyframes pulseDot{
    0%{ box-shadow: 0 0 0 0 rgba(142,224,168,.55); }
    70%{ box-shadow: 0 0 0 7px rgba(142,224,168,0); }
    100%{ box-shadow: 0 0 0 0 rgba(142,224,168,0); }
  }
  .online-bar strong{ color: var(--gold-bright); font-weight:600; }

  /* ---------- divination CTA (home banner) ---------- */
  .div-cta{
    position:relative;
    display:flex; flex-direction:column; align-items:center; text-align:center;
    margin: 4px 0 46px;
    padding: 40px 28px 38px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .div-cta::before, .div-cta::after{
    content:""; position:absolute; left:50%; transform:translateX(-50%);
    width:34px; height:1px; background: var(--gold-dim);
  }
  .div-cta::before{ top:-1px; } .div-cta::after{ bottom:-1px; }
  .div-cta-sphere{
    margin-bottom:14px; display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .div-cta .eyebrow{
    font-family: var(--display); font-size:.66rem; letter-spacing:.32em; color: var(--gold-dim);
  }
  .div-cta h2{
    font-family: var(--serif); font-size: clamp(1.3rem, 2.6vw, 1.7rem); font-weight:700;
    margin-top:8px; color: var(--ink);
  }
  .div-cta p{
    margin-top:8px; font-size:.86rem; color: var(--ink-dim); font-weight:300; max-width:420px; line-height:1.85;
    margin-left:auto; margin-right:auto;
  }
  .div-cta-btn{
    margin-top:20px; display:inline-block; cursor:pointer;
    background:none; border:1px solid var(--gold); color: var(--gold-bright);
    font-family: var(--serif); font-size:.92rem; letter-spacing:.05em;
    padding: 10px 26px; border-radius:2px;
    transition: background .25s ease, color .25s ease, box-shadow .25s ease;
  }
  .div-cta-btn:hover{ background: var(--gold); color: #1a0f2e; box-shadow: 0 10px 26px -10px var(--purple-glow); }
  .div-cta-actions{ display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin-top:20px; }
  .div-cta-btn.secondary{
    border-color: var(--purple-2); color: var(--ink-dim);
  }
  .div-cta-btn.secondary:hover{ background: var(--purple-2); color:#fff; box-shadow: 0 10px 26px -10px var(--purple-glow); }
  @media (max-width: 620px){
    .div-cta{ padding:28px 20px 30px; }
  }

  /* ---------- divination flow ---------- */
  .div-step{ padding: 44px 34px 40px; text-align:center; }
  .div-step .step-eyebrow{
    font-family: var(--display); font-size:.66rem; letter-spacing:.3em; color: var(--gold-dim);
  }
  .div-step h3{
    font-family: var(--serif); font-size:1.4rem; font-weight:700; margin-top:10px; color: var(--ink);
  }
  .div-step .hint{
    margin-top:12px; font-size:.88rem; color: var(--ink-dim); font-weight:300; line-height:1.9;
    max-width:420px; margin-left:auto; margin-right:auto;
  }

  .aspect-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:14px; max-width:380px; margin: 28px auto 0;
  }
  .aspect-btn{
    cursor:pointer; background: var(--bg-panel); border:1px solid var(--line); border-radius:4px;
    padding: 20px 10px; color: var(--ink-dim); font-family: var(--serif); font-size:1rem;
    transition: border-color .25s, color .25s, transform .25s;
  }
  .aspect-btn:hover{ border-color: var(--gold); color: var(--gold-bright); transform: translateY(-4px); }

  .draw-btn{
    margin: 22px auto 0; cursor:pointer;
    width:130px; height:130px; border-radius:50%;
    background: radial-gradient(circle at 50% 35%, var(--purple-2), var(--bg-panel) 75%);
    border:1px solid var(--gold);
    color: var(--gold-bright); font-family: var(--serif); font-size:1.05rem; letter-spacing:.06em;
    display:flex; align-items:center; justify-content:center;
    transition: transform .3s ease, box-shadow .3s ease;
  }
  .draw-btn:hover{ transform: scale(1.06); box-shadow: 0 0 40px -6px var(--purple-glow); }
  .draw-btn:active{ transform: scale(.97); }
  .draw-btn:disabled{ cursor:default; }
  .draw-btn.is-drawing{ animation: drawPulse 1s ease-in-out infinite; }
  @keyframes drawPulse{
    0%,100%{ box-shadow: 0 0 0 0 var(--purple-glow); }
    50%{ box-shadow: 0 0 46px 8px var(--purple-glow); }
  }
  .div-actions button:disabled{ opacity:.5; cursor:default; }

  .chosen-tag{
    display:inline-block; margin-top:14px; font-size:.8rem; color: var(--gold);
    border:1px solid var(--line); border-radius:20px; padding:4px 16px;
  }

  .restricted-notice{
    margin-top:26px; padding: 20px 22px; border:1px solid var(--line); border-radius:4px;
    background: rgba(160,60,60,.08); color: var(--ink-dim); font-size:.86rem; line-height:1.9; font-weight:300;
  }
  .restricted-notice strong{ color:#e08a8a; display:block; margin-bottom:6px; font-family:var(--serif); font-size:.98rem; }

  /* ---------- card sphere（抽卡牌陣球特效） ---------- */
  .card-sphere-stage{
    margin-top: 26px; display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .card-sphere{
    position:relative; width:280px; height:280px; max-width:78vw; max-height:78vw;
    perspective: 900px; cursor:grab; touch-action:none;
  }
  .card-sphere.dragging{ cursor:grabbing; }
  .card-sphere .sphere-card{
    position:absolute; left:50%; top:50%; width:40px; height:62px;
    border-radius:5px; overflow:hidden; pointer-events:none; will-change:transform,opacity;
    box-shadow: 0 6px 16px -6px rgba(0,0,0,.65), 0 0 0 1px rgba(205,168,78,.3);
  }
  .card-sphere .sphere-card img{ width:100%; height:100%; object-fit:cover; display:block; }
  .card-sphere-hint{
    font-size:.76rem; color: var(--ink-faint); letter-spacing:.04em; font-weight:300;
  }

  .result-wrap{ display:grid; grid-template-columns: 230px 1fr; }
  .result-media{
    padding: 34px 28px; display:flex; flex-direction:column; align-items:center;
    border-right: 1px solid var(--line);
  }
  .result-media .frame-outer{
    width:100%; max-width:190px; aspect-ratio:2/3.35;
    display:flex; align-items:center; justify-content:center; overflow:visible;
  }
  .result-card-img{
    width:100%; height:100%; object-fit:cover; border-radius:8px;
    border:1px solid var(--line); box-shadow:0 20px 40px -14px rgba(0,0,0,.6);
    transform: rotate(0deg);
    animation: cardInUpright .55s cubic-bezier(.2,.8,.25,1) forwards;
  }
  .result-card-img.is-reversed{
    transform: rotate(180deg);
    animation: cardInReversed .55s cubic-bezier(.2,.8,.25,1) forwards;
  }
  @keyframes cardInUpright{ 0%{ opacity:0; transform: scale(.85) rotate(0deg);} 100%{ opacity:1; transform: scale(1) rotate(0deg);} }
  @keyframes cardInReversed{ 0%{ opacity:0; transform: scale(.85) rotate(180deg);} 100%{ opacity:1; transform: scale(1) rotate(180deg);} }

  .polarity-badge{
    margin-top:16px; font-family: var(--display); font-size:.68rem; letter-spacing:.24em;
    padding:5px 14px; border-radius:20px; border:1px solid var(--gold-dim); color: var(--gold);
  }
  .polarity-badge.reversed{ border-color:#9a7bd6; color:#c3aaf0; }

  .result-info{ padding: 32px 34px 34px 30px; text-align:left; min-width:0; }
  .result-info h3{ font-family: var(--serif); font-size:1.5rem; font-weight:700; color: var(--ink); }
  .result-info .name-en{ font-family: var(--display); font-size:.78rem; letter-spacing:.12em; color: var(--ink-faint); margin-top:4px; }

  .aspect-highlight{
    margin-top:20px; padding: 16px 18px; border-left:2px solid var(--gold);
    background: rgba(205,168,78,.06); border-radius:2px;
  }
  .aspect-highlight h4{ font-family: var(--serif); font-size:.88rem; color: var(--gold-bright); font-weight:600; }
  .aspect-highlight p{ margin-top:6px; font-size:.86rem; line-height:1.85; color: var(--ink-dim); font-weight:300; }

  .result-desc{ margin-top:16px; font-size:.86rem; line-height:1.9; color: var(--ink-dim); font-weight:300; }

  .reminder-note{
    margin-top:22px; padding-top:18px; border-top: 1px dashed var(--line);
    font-size:.8rem; color: var(--ink-faint); line-height:1.85; font-weight:300;
  }
  .reminder-note strong{ color: var(--ink-dim); }
  .reminder-warn{
    margin-top:10px; color:#e0b98a; font-size:.8rem; line-height:1.85;
  }

  .div-actions{ margin-top:24px; display:flex; gap:12px; }
  .div-actions button{
    flex:1; padding:11px 14px; border-radius:2px; cursor:pointer;
    font-family: var(--serif); font-size:.88rem; letter-spacing:.03em;
    transition: background .25s, color .25s, border-color .25s;
  }
  .div-actions .btn-ghost{ background:none; border:1px solid var(--line); color: var(--ink-dim); }
  .div-actions .btn-ghost:hover{ border-color: var(--gold); color: var(--gold-bright); }
  .div-actions .btn-solid{ background: var(--gold); border:1px solid var(--gold); color:#1a0f2e; font-weight:600; }
  .div-actions .btn-solid:hover{ background: var(--gold-bright); }

  @media (max-width: 620px){
    .result-wrap{ grid-template-columns:1fr; }
    .result-media{ border-right:none; border-bottom:1px solid var(--line); }
    .result-info{ padding:26px 24px 30px; }
  }
</style>
</head>

<!-- Firebase（僅用於「目前在線人數」統計；免費 Spark 方案即可）-->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>

<script>
(function(){
  // ---------------- starfield ----------------
  var starsEl = document.getElementById('stars');
  var starCount = window.innerWidth < 640 ? 40 : 80;
  var frag = document.createDocumentFragment();
  for (var i=0;i<starCount;i++){
    var s = document.createElement('div');
    s.className='star';
    var size = (Math.random()*2+1).toFixed(1);
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.left = (Math.random()*100)+'%';
    s.style.top = (Math.random()*100)+'%';
    s.style.animationDelay = (Math.random()*4).toFixed(2)+'s';
    s.style.animationDuration = (3+Math.random()*3).toFixed(2)+'s';
    frag.appendChild(s);
  }
  starsEl.appendChild(frag);

  // ---------------- state ----------------
  var DATA = null;
  var CARDS = [];
  var SUIT_META = {};
  var view = { screen:'home', suitKey:null };

  var CATEGORY_ORDER = [
    { key:'大阿爾克那', label:'大阿爾克那', accent:'var(--major)', glyph: glyphStar() },
    { key:'權杖', label:'權杖', accent:'var(--wands)', glyph: glyphWand() },
    { key:'聖杯', label:'聖杯', accent:'var(--cups)', glyph: glyphCup() },
    { key:'寶劍', label:'寶劍', accent:'var(--swords)', glyph: glyphSword() },
    { key:'錢幣', label:'金錢', sub:'錢幣', accent:'var(--pentacles)', glyph: glyphCoin() }
  ];

  function glyphStar(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M12 2 L14 9 L21 9 L15.5 13.2 L17.5 20 L12 16 L6.5 20 L8.5 13.2 L3 9 L10 9 Z"/></svg>'; }
  function glyphWand(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><line x1="5" y1="19" x2="19" y2="5"/><path d="M15 5 L19 5 L19 9" /><path d="M5 19 L5 15" /></svg>'; }
  function glyphCup(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M6 4 H18 L16 13 A4 4 0 0 1 8 13 Z"/><line x1="12" y1="17" x2="12" y2="20"/><line x1="8" y1="20" x2="16" y2="20"/></svg>'; }
  function glyphSword(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><line x1="12" y1="2" x2="12" y2="16"/><path d="M8 6 H16"/><path d="M9 16 L12 21 L15 16 Z"/></svg>'; }
  function glyphCoin(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><circle cx="12" cy="12" r="9"/><path d="M12 7 L14 10 L12 12 L10 14 L12 17"/></svg>'; }

  var mainEl = document.getElementById('main');
  var crumbEl = document.getElementById('crumbbar');

  fetch('data.json')
    .then(function(r){ return r.json(); })
    .then(function(json){
      DATA = json;
      CARDS = json.cards || [];
      SUIT_META = (json.meta && json.meta.suits) || {};
      renderHome();
    })
    .catch(function(err){
      mainEl.innerHTML = '<div class="empty-state">資料載入失敗，請確認 data.json 是否與 index.html 放在同一層。<br><span style="color:var(--ink-faint);font-size:.8rem;">'+err+'</span></div>';
    });

  function countFor(catKey){
    return CARDS.filter(function(c){ return c.arcana === '大阿爾克那' ? catKey==='大阿爾克那' : c.suit === catKey; }).length;
  }

  function renderHome(){
    view = { screen:'home', suitKey:null };
    stopHomeSphere();
    crumbEl.innerHTML = '';
    var html = '' +
      '<div class="div-cta">' +
        '<div class="div-cta-sphere"><div class="card-sphere" id="homeCardSphere"></div><div class="card-sphere-hint">拖曳可轉動牌陣</div></div>' +
        '<div class="eyebrow">DIVINATION</div>' +
        '<h2>靜下心來，抽一張牌</h2>' +
        '<p>在心中默想你想詢問的問題——關於愛情、事業、財運或健康，讓貝拉為你抽出此刻的指引。</p>' +
        '<div class="div-cta-actions">' +
          '<button class="div-cta-btn" id="openDivBtn">開始占卜</button>' +
          '<button class="div-cta-btn secondary" id="openDecisionBtn">抽一支決策籤</button>' +
        '</div>' +
        '<p style="margin-top:14px;font-size:.78rem;color:var(--ink-faint);max-width:420px;">「決策籤」不分愛情、事業、財運、健康，只要面臨任何需要抉擇的時刻都能抽問，不限時間、不限次數。</p>' +
      '</div>';
    html += '<div class="section-head"><h2>選擇一個牌組</h2><p>大阿爾克那訴說靈魂的重大課題；四組小阿爾克那則對應日常的行動、情感、思緒與現實。</p></div>';
    html += '<div class="toolbar"><div class="search-box"><input type="text" id="searchInput" placeholder="搜尋全部 78 張牌，例如：戀人、聖杯三、Star..." autocomplete="off"></div><div class="search-note hidden" id="searchNote"></div></div>';
    html += '<div class="card-grid hidden" id="cardGrid"></div>';
    html += '<div class="cat-grid" id="catGrid">';
    CATEGORY_ORDER.forEach(function(cat){
      html += '' +
        '<div class="cat-card" data-suit="'+cat.key+'" style="--accent:'+cat.accent+'" tabindex="0" role="button" aria-label="'+cat.label+'">'+
          '<div class="glyph">'+cat.glyph+'</div>'+
          '<h3>'+cat.label+'</h3>'+
          '<span class="en">'+((SUIT_META[cat.key]&&SUIT_META[cat.key].name_en)||'')+'</span>'+
          '<div class="count">'+countFor(cat.key)+' 張</div>'+
        '</div>';
    });
    html += '</div>';
    mainEl.innerHTML = html;

    Array.prototype.forEach.call(mainEl.querySelectorAll('.cat-card'), function(el){
      el.addEventListener('click', function(){ renderSuit(el.getAttribute('data-suit')); });
      el.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); renderSuit(el.getAttribute('data-suit')); } });
    });
    document.getElementById('openDivBtn').addEventListener('click', function(){ openDivination('aspect'); });
    document.getElementById('openDecisionBtn').addEventListener('click', function(){ openDivination('decision'); });

    var homeSphereEl = document.getElementById('homeCardSphere');
    if(homeSphereEl){ homeSphereCtl = createCardSphere(homeSphereEl); }

    // 首頁搜尋：直接搜尋全部 78 張牌
    bindGlobalSearch(function(){
      document.getElementById('catGrid').classList.remove('hidden');
    }, function(){
      document.getElementById('catGrid').classList.add('hidden');
    });
  }

  // ---------------- 全牌組搜尋 ----------------
  // 比對範圍：中文牌名、英文牌名、牌組名稱、正逆位關鍵字
  function searchAllCards(q){
    var s = q.toLowerCase();
    return CARDS.filter(function(c){
      if((c.name||'').indexOf(q) > -1) return true;
      if((c.name_en||'').toLowerCase().indexOf(s) > -1) return true;
      if((c.suit||'').indexOf(q) > -1) return true;
      if((c.arcana||'').indexOf(q) > -1) return true;
      var kws = (c.upright_keywords||[]).concat(c.reversed_keywords||[]);
      for(var i=0;i<kws.length;i++){ if(String(kws[i]).indexOf(q) > -1) return true; }
      return false;
    });
  }

  // 共用的搜尋框行為：有輸入 → 全牌組搜尋；清空 → 還原原本畫面
  // onClear / onSearching 用來切換該頁面原本的內容顯示與否
  function bindGlobalSearch(onClear, onSearching){
    var input = document.getElementById('searchInput');
    var note = document.getElementById('searchNote');
    var grid = document.getElementById('cardGrid');
    if(!input) return;

    input.addEventListener('input', function(e){
      var q = e.target.value.trim();
      if(!q){
        note.classList.add('hidden');
        note.innerHTML = '';
        if(onClear) onClear();
        return;
      }
      var results = searchAllCards(q);
      if(onSearching) onSearching();
      grid.classList.remove('hidden');
      note.classList.remove('hidden');
      note.innerHTML = '全部牌組搜尋「<b>'+escapeHtml(q)+'</b>」：找到 <b>'+results.length+'</b> 張';
      renderGrid(results, null, true);
    });
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(m){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
    });
  }

  function catKeyOf(card){
    return card.arcana === '大阿爾克那' ? '大阿爾克那' : card.suit;
  }

  function glyphEye(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M2 12 C5 6 9 4 12 4 C15 4 19 6 22 12 C19 18 15 20 12 20 C9 20 5 18 2 12 Z"/><circle cx="12" cy="12" r="3.2"/></svg>'; }

  function accentFor(catKey){
    var found = CATEGORY_ORDER.filter(function(c){return c.key===catKey;})[0];
    return found ? found.accent : 'var(--gold)';
  }
  function labelFor(catKey){
    var found = CATEGORY_ORDER.filter(function(c){return c.key===catKey;})[0];
    return found ? found.label : catKey;
  }

  function renderSuit(suitKey){
    view = { screen:'suit', suitKey: suitKey };
    stopHomeSphere();
    var meta = SUIT_META[suitKey] || {};
    var accent = accentFor(suitKey);
    var label = labelFor(suitKey);

    crumbEl.innerHTML = '<button id="crumbHome">首頁</button>' +
      CATEGORY_ORDER.map(function(cat){
        if(cat.key === suitKey){
          return '<span class="crumb-sep">·</span><span class="crumb-current">'+cat.label+'</span>';
        }
        return '<span class="crumb-sep">·</span><button class="crumb-cat" data-suit="'+cat.key+'">'+cat.label+'</button>';
      }).join('');
    document.getElementById('crumbHome').addEventListener('click', renderHome);
    Array.prototype.forEach.call(crumbEl.querySelectorAll('.crumb-cat'), function(el){
      el.addEventListener('click', function(){ renderSuit(el.getAttribute('data-suit')); });
    });

    var list = CARDS.filter(function(c){ return suitKey==='大阿爾克那' ? c.arcana==='大阿爾克那' : c.suit===suitKey; });

    var html = '<div class="section-head" style="--accent:'+accent+'">'+
      '<h2>'+label+'</h2>'+
      (meta.meaning ? '<p>'+meta.meaning+'</p>' : '') +
      (meta.theme ? '<div class="element-tag" style="color:'+accent+'">'+ (meta.element && meta.element!=='—' ? meta.element+'元素 · ' : '') + meta.theme + '</div>' : '') +
    '</div>';

    html += '<div class="toolbar"><div class="search-box"><input type="text" id="searchInput" placeholder="搜尋全部 78 張牌，例如：戀人、聖杯三、Star..." autocomplete="off"></div><div class="search-note hidden" id="searchNote"></div></div>';
    html += '<div class="card-grid" id="cardGrid"></div>';

    mainEl.innerHTML = html;
    renderGrid(list, accent);

    // 搜尋時跨所有牌組；清空時回到本牌組
    bindGlobalSearch(function(){ renderGrid(list, accent); }, null);
  }

  // accent 傳 null 時，每張牌各自使用所屬牌組的代表色（跨牌組搜尋結果用）
  function renderGrid(list, accent, showSuitHint){
    var grid = document.getElementById('cardGrid');
    if(!grid) return;
    if(!list.length){
      grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;">沒有符合的牌卡</div>';
      return;
    }
    var html = '';
    list.forEach(function(c){
      var cardAccent = accent || accentFor(catKeyOf(c));
      html += '' +
        '<div class="tcard" data-id="'+c.id+'" data-accent="'+cardAccent+'" style="--accent-c:'+cardAccent+'" tabindex="0" role="button" aria-label="'+c.name+'">'+
          '<div class="frame"><img src="images/'+c.image+'" alt="'+c.name+'" loading="lazy"></div>'+
          '<div class="label">'+c.name+'</div>'+
          (showSuitHint ? '<div class="suit-hint">'+labelFor(catKeyOf(c))+'</div>' : '')+
        '</div>';
    });
    grid.innerHTML = html;
    Array.prototype.forEach.call(grid.querySelectorAll('.tcard'), function(el){
      var a = el.getAttribute('data-accent');
      el.addEventListener('click', function(){ openModal(el.getAttribute('data-id'), a); });
      el.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openModal(el.getAttribute('data-id'), a); } });
    });
  }

  // ---------------- modal ----------------
  var overlay = document.getElementById('modalOverlay');
  var panel = document.getElementById('modalPanel');
  var body = document.getElementById('modalBody');
  var closeBtn = document.getElementById('modalClose');
  var currentPolarity = 'upright';

  function openModal(id, accent){
    var card = CARDS.filter(function(c){ return c.id===id; })[0];
    if(!card) return;
    currentPolarity = 'upright';
    renderModalContent(card, accent);
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function renderModalContent(card, accent){
    var rankText = card.arcana==='大阿爾克那' ? '' : card.name.slice(card.suit.length);
    var numLabel = card.arcana==='大阿爾克那' ? ('NO. '+String(card.number).padStart(2,'0')) : (labelFor(card.suit)+' · '+rankText);

    var aspectLabels = { love:'愛情', career:'事業', wealth:'財運', health:'健康' };
    var polarityData = card[currentPolarity] || {};
    var keywords = currentPolarity==='upright' ? card.upright_keywords : card.reversed_keywords;

    var aspectsHtml = '';
    ['love','career','wealth','health'].forEach(function(k){
      if(polarityData[k]){
        aspectsHtml += '<div class="aspect-item"><h4><span class="dot" style="background:'+accent+'"></span>'+aspectLabels[k]+'</h4><p>'+polarityData[k]+'</p></div>';
      }
    });
    var decisionHtml = polarityData.decision
      ? '<div class="decision-block"><h4><span class="dot" style="background:'+accent+'"></span>決策籤指引</h4><p>'+polarityData.decision+'</p></div>'
      : '';

    body.style.setProperty('--accent-c', accent);
    body.innerHTML = '' +
      '<div class="modal-media">' +
        '<img src="images/'+card.image+'" alt="'+card.name+'">' +
        '<div class="num">'+numLabel+'</div>' +
      '</div>' +
      '<div class="modal-info" style="--accent-c:'+accent+'">' +
        '<div class="suit-tag">'+(card.arcana==='大阿爾克那' ? '大阿爾克那' : labelFor(card.suit)+' · 小阿爾克那')+'</div>' +
        '<h3>'+card.name+'</h3>' +
        '<div class="name-en">'+(card.name_en||'')+'</div>' +
        '<div class="desc">'+(card.description||'')+'</div>' +
        '<div class="polarity-tabs">' +
          '<button data-p="upright" class="'+(currentPolarity==='upright'?'active':'')+'">正位</button>' +
          '<button data-p="reversed" class="'+(currentPolarity==='reversed'?'active':'')+'">逆位</button>' +
        '</div>' +
        '<div class="keywords">'+ (keywords||[]).map(function(k){ return '<span>'+k+'</span>'; }).join('') +'</div>' +
        '<div class="aspects">'+aspectsHtml+'</div>' +
        decisionHtml +
      '</div>';

    Array.prototype.forEach.call(body.querySelectorAll('.polarity-tabs button'), function(btn){
      btn.addEventListener('click', function(){
        currentPolarity = btn.getAttribute('data-p');
        renderModalContent(card, accent);
      });
    });
  }

  function closeModal(){
    overlay.classList.remove('open');
    document.body.style.overflow = '';
  }
  closeBtn.addEventListener('click', closeModal);
  overlay.addEventListener('click', function(e){ if(e.target===overlay) closeModal(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });

  // ================= 占卜功能 =================

  // 逆位機率：0.5 為正逆各半；可依需求調整（建議範圍 0.35～0.5，詳見說明文件）
  var REVERSED_PROBABILITY = 0.45;

  var ASPECTS = [
    { key:'love', label:'愛情' },
    { key:'career', label:'事業' },
    { key:'wealth', label:'財運' },
    { key:'health', label:'健康' }
  ];
  function aspectLabelOf(key){
    var f = ASPECTS.filter(function(a){ return a.key===key; })[0];
    return f ? f.label : key;
  }

  // 使用瀏覽器原生的加密隨機數（比 Math.random 更均勻、不可預測）
  function secureRandom(){
    if(window.crypto && window.crypto.getRandomValues){
      var arr = new Uint32Array(1);
      window.crypto.getRandomValues(arr);
      return arr[0] / 4294967296;
    }
    return Math.random();
  }

  function drawRandomCard(){

  function fibonacciSpherePoints(count, radius){
    var pts = [];
    if(count <= 0) return pts;
    var offset = 2 / count;
    var increment = Math.PI * (3 - Math.sqrt(5));
    for (var i = 0; i < count; i++){
      var y = ((i * offset) - 1) + (offset / 2);
      var r = Math.sqrt(Math.max(0, 1 - y * y));
      var phi = i * increment;
      pts.push({ x: Math.cos(phi) * r * radius, y: y * radius, z: Math.sin(phi) * r * radius });
    }
    return pts;
  }

  // 建立一顆獨立的牌陣球實例，回傳 { stop, spinAndReveal }；同一頁面可同時存在多顆（首頁一顆、占卜視窗一顆）
  function createCardSphere(container){
    if(!CARDS.length) return null;

    var radius = 118;
    var points = fibonacciSpherePoints(CARDS.length, radius);
    var rot = { x: 16, y: 0 };
    var vel = { x: 0, y: 0.18 };
    var dragging = false;
    var last = { x: 0, y: 0 };
    var nodes = [];
    var spinning = false;
    var spinIndex = -1;
    var spinStart = 0;
    var spinDone = null;
    var SPIN_MS = 1000;

    var frag = document.createDocumentFragment();
    CARDS.forEach(function(c, i){
      var el = document.createElement('div');
      el.className = 'sphere-card';
      var img = document.createElement('img');
      img.src = 'images/' + c.image;
      img.alt = c.name || '';
      img.draggable = false;
      img.loading = i < 16 ? 'eager' : 'lazy';
      el.appendChild(img);
      frag.appendChild(el);
      nodes.push(el);
    });
    container.innerHTML = '';
    container.appendChild(frag);

    function render(){
      var rx = rot.x * Math.PI / 180, ry = rot.y * Math.PI / 180;
      for (var i = 0; i < nodes.length; i++){
        var p = points[i];
        var x1 = p.x * Math.cos(ry) + p.z * Math.sin(ry);
        var z1 = -p.x * Math.sin(ry) + p.z * Math.cos(ry);
        var y1 = p.y * Math.cos(rx) - z1 * Math.sin(rx);
        var z2 = p.y * Math.sin(rx) + z1 * Math.cos(rx);
        var depth = (z2 + radius) / (2 * radius);
        var scale = 0.5 + depth * 0.75;
        var opacity = Math.max(0.18, Math.min(1, 0.25 + depth * 0.9));
        nodes[i].style.transform = 'translate(-50%,-50%) translate3d(' + x1.toFixed(1) + 'px,' + y1.toFixed(1) + 'px,0) scale(' + scale.toFixed(3) + ')';
        nodes[i].style.zIndex = Math.round(1000 + z2);
        nodes[i].style.opacity = opacity.toFixed(2);
      }
    }

    function revealPickedCard(){
      var target = nodes[spinIndex];
      for (var i = 0; i < nodes.length; i++){
        if(i === spinIndex) continue;
        nodes[i].style.transition = 'opacity .4s ease';
        nodes[i].style.opacity = '0';
      }
      if(target){
        target.style.transition = 'transform .55s cubic-bezier(.2,.8,.25,1), opacity .25s ease';
        target.style.zIndex = '3000';
        target.style.opacity = '1';
        target.style.transform = 'translate(-50%,-50%) translate3d(0px,0px,0) scale(2.8)';
      }
      var cb = spinDone;
      spinDone = null;
      setTimeout(function(){ if(cb) cb(); }, 500);
    }

    function loop(){
      if(spinning){
        var elapsed = Date.now() - spinStart;
        var boost = elapsed < SPIN_MS * 0.6 ? 6.5 : Math.max(0.4, 6.5 * (1 - (elapsed - SPIN_MS * 0.6) / (SPIN_MS * 0.4)));
        rot.y += boost;
        render();
        if(elapsed >= SPIN_MS){
          spinning = false;
          cancelAnimationFrame(raf);
          revealPickedCard();
          return;
        }
        raf = requestAnimationFrame(loop);
        return;
      }
      if(!dragging){
        rot.y += vel.y;
        rot.x += vel.x;
        vel.x *= 0.94;
        vel.y += (0.18 - vel.y) * 0.02;
      }
      render();
      raf = requestAnimationFrame(loop);
    }
    var raf = requestAnimationFrame(loop);

    function pointFromEvent(e){
      return (e.touches && e.touches.length) ? e.touches[0] : e;
    }
    function onDown(e){
      if(spinning) return;
      dragging = true;
      var pt = pointFromEvent(e);
      last = { x: pt.clientX, y: pt.clientY };
      container.classList.add('dragging');
    }
    function onMove(e){
      if(!dragging || spinning) return;
      var pt = pointFromEvent(e);
      var dx = pt.clientX - last.x, dy = pt.clientY - last.y;
      rot.y += dx * 0.4;
      rot.x = Math.max(-70, Math.min(70, rot.x - dy * 0.4));
      vel = { x: -dy * 0.4, y: dx * 0.4 };
      last = { x: pt.clientX, y: pt.clientY };
      if(e.cancelable) e.preventDefault();
    }
    function onUp(){
      dragging = false;
      container.classList.remove('dragging');
    }

    container.addEventListener('mousedown', onDown);
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    container.addEventListener('touchstart', onDown, { passive: true });
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onUp);

    var ctl = {
      stop: function(){
        cancelAnimationFrame(raf);
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        document.removeEventListener('touchmove', onMove);
        document.removeEventListener('touchend', onUp);
      },
      // 讓球陣先快速自轉，接著把抽中的那張牌從球陣中放大「飛出」，動畫結束後呼叫 onDone
      spinAndReveal: function(index, onDone){
        dragging = false;
        container.classList.remove('dragging');
        container.classList.add('is-drawing');
        spinIndex = Math.max(0, Math.min(nodes.length - 1, index));
        spinDone = onDone;
        spinning = true;
        spinStart = Date.now();
      }
    };
    return ctl;
  }

    if(divSphereCtl && divSphereCtl.spinAndReveal){

    } else {
      finish();
    }

      var myRef = db.ref('presence').push();

          } else {
            // 超過門檻沒有心跳，視為幽靈連線（例如瀏覽器被強制關閉、斷網未觸發 onDisconnect）
            staleRefs.push(child.ref);
          }
        });

        // 任何一個在線的分頁都會順手清掉過期的幽靈節點，讓資料庫自動維持乾淨
        // （規則需允許已登入的使用者寫入/刪除 presence 底下的節點，失敗就靜默略過，不影響顯示）
        staleRefs.forEach(function(ref){ ref.remove().catch(function(){}); });

        console.log('[線上人數] presence 共 ' + snap.numChildren() + ' 筆，其中有效 ' + liveCount + ' 筆，清除幽靈節點 ' + staleRefs.length + ' 筆');

        bar.classList.remove('hidden');
        text.innerHTML = '目前有 <strong>' + Math.max(liveCount, 1) + '</strong> 人正在貝拉神秘魔法屋占卜';
      }, function(err){
        clearTimeout(watchdog);
        fail('讀取 presence 失敗（' + err.code + '）。請把 Realtime Database 規則改成允許讀寫 presence 節點：{"rules":{"presence":{".read":"auth != null",".write":"auth != null"}}}');
      });
    });
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', initOnlinePresence);
  } else {
    initOnlinePresence();
  }

})();
</script>

</body>
</html>
